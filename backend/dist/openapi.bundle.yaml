openapi: 3.1.0
info:
  title: MarketElectro API
  version: 1.0.0
  description: |
    API REST de la plateforme MarketElectro.

    Fonctionnalités :

      - Authentification JWT
      - Gestion des utilisateurs
      - Gestion des produits
      - Gestion du panier
      - Gestion des commandes
  contact:
    name: Josué Amegadjin
    email: josue@example.com
servers:
  - url: http://localhost:5000/api
    description: Serveur de développement
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Products
  - name: Cart
  - name: Orders
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Créer un nouveau compte utilisateur
      description: |
        Permet à un nouvel utilisateur de créer un compte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
              properties:
                fullName:
                  type: string
                  example: Josué Amegadjin
                email:
                  type: string
                  format: email
                  example: josue@example.com
                password:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Utilisateur créé avec succès
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authentifier un utilisateur
      description: |
        Retourne un JWT après authentification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: josue@example.com
                password:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Connexion réussie
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Récupérer le profil de l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil récupéré
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6a62432a868285c94ad14f58
        fullName:
          type: string
          example: Josué Amegadjin
        email:
          type: string
          format: email
          example: josue@example.com
        role:
          type: string
          enum:
            - customer
            - admin
          example: customer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - fullName
        - email
        - role
    Product:
      type: object
      properties:
        _id:
          type: string
          example: 6a65ba09d5996d86848e02b9
        name:
          type: string
          example: MacBook Pro M4
        description:
          type: string
          example: Ordinateur portable Apple
        price:
          type: number
          example: 2300
        image:
          type: string
          example: /assets/macbook.jpg
        category:
          type: string
          example: Ordinateurs
        stock:
          type: integer
          example: 20
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - description
        - price
        - stock
    Cart:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              product:
                $ref: '#/components/schemas/Product'
              quantity:
                type: integer
                example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              product:
                $ref: '#/components/schemas/Product'
              quantity:
                type: integer
                example: 5
              price:
                type: number
                example: 2300
        totalAmount:
          type: number
          example: 11500
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - delivered
            - cancelled
          example: pending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Email ou mot de passe incorrect
      required:
        - success
        - message
  responses:
    Success:
      description: Requête exécutée avec succès
    BadRequest:
      description: Requête invalide
    Unauthorized:
      description: Authentification requise
    Forbidden:
      description: Accès interdit
    NotFound:
      description: Ressource introuvable
    InternalServerError:
      description: Erreur interne du serveur
